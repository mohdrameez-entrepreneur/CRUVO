{% load static %}
<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="description" content="IGNITION Flag Stop - Signal a stop to your riding group for fuel, food, break, or emergency."/>
<meta property="og:title" content="IGNITION - Flag Stop"/>
<meta property="og:description" content="Signal a stop to your riding group for fuel, food, break, or emergency."/>
<meta property="og:type" content="website"/>
<link rel="icon" type="image/svg+xml" href="{% static 'pages/favicon.svg' %}"/>
<title>IGNITION - Flag Stop</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script src="{% static 'pages/tailwind-config.js' %}"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap');
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden antialiased flex flex-col relative font-body-md text-body-md">
<!-- Canvas: Map Background (Layer 0) -->
<div class="absolute inset-0 z-0 bg-surface-dim">
<div class="w-full h-full bg-cover bg-center opacity-60 mix-blend-screen" data-alt="A highly detailed, top-down digital map interface designed for a motorcycle GPS navigation system. The map features a high-contrast dark mode aesthetic with deep black and charcoal terrain, punctuated by stark white and vibrant neon amber route lines. The lighting suggests an active screen display in a rugged, outdoor environment. The style is strictly technical, utilitarian, and premium, resembling aeronautical instrumentation." data-location="Stelvio Pass" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDlTqHvVXQwUue6tUoFIrsP47ikzkZdd1lp1tcgU3-2TGeEFpRhUYKIW8ZbxMmRQnQdqo6yKHjUwOEhuH4F73zDg3eFapl2pWQoMP_d4U-CflxElRfUQSUb36MY-iourt6FnjLotBf07JbN2oSPz98bXWqfvnuS4CT1-l2fCzmrAsSbpImK6V88TWCdRKLAy0OilhW7KW-F7Nqh_rPhUL0UEncv6oh3fqSGAlAnNALSuwgYhJKtWSc')"></div>
<!-- Subtle Map Grid Overlay for technical feel -->
<div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none"></div>
</div>
<!-- Map UI Elements (Simulated background context) -->
<div class="absolute top-margin-mobile right-margin-mobile z-10 flex flex-col gap-unit">
<button class="w-[48px] h-[48px] bg-surface-container border border-outline-variant rounded-full flex items-center justify-center text-on-surface shadow-[0px_4px_0px_rgba(0,0,0,0.5)] active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
</div>
<!-- Backdrop Overlay (Layer 1 prep) -->
<div class="absolute inset-0 bg-background/60 backdrop-blur-sm z-40"></div>
<!-- Bottom Sheet (Layer 1/2) -->
<div class="absolute bottom-0 left-0 w-full bg-surface border-t-2 border-outline-variant rounded-t-[24px] z-50 flex flex-col pt-4 pb-margin-mobile px-margin-mobile shadow-[0px_-8px_24px_rgba(0,0,0,0.8)] animate-[slideUp_0.3s_ease-out_forwards]">
<!-- Drag Handle -->
<div class="w-16 h-[4px] bg-outline-variant rounded-full mx-auto mb-6"></div>
<!-- Header -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Flag a stop?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your current location will be shared with the riders in this active ride.</p>
</div>
<!-- Options Bento Grid -->
<div class="grid grid-cols-3 gap-unit mb-stack-lg">
<!-- Option: Fuel (Selected State) -->
<button onclick="selectStopType(this)" class="stop-option flex flex-col items-center justify-center p-stack-sm border-2 border-primary bg-primary/10 rounded-lg min-h-[88px] gap-2 active:scale-95 transition-transform relative overflow-hidden" data-type="fuel">
<div class="absolute inset-0 bg-primary opacity-5"></div>
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="local_gas_station" style="font-variation-settings: 'FILL' 1;">local_gas_station</span>
<span class="font-label-technical text-label-technical text-primary tracking-widest uppercase">Fuel</span>
</button>
<!-- Option: Food -->
<button onclick="selectStopType(this)" class="stop-option flex flex-col items-center justify-center p-stack-sm border border-outline-variant bg-surface-container rounded-lg min-h-[88px] gap-2 active:scale-95 transition-transform" data-type="food">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]" data-icon="restaurant">restaurant</span>
<span class="font-label-technical text-label-technical text-on-surface-variant tracking-widest uppercase">Food</span>
</button>
<!-- Option: Break -->
<button onclick="selectStopType(this)" class="stop-option flex flex-col items-center justify-center p-stack-sm border border-outline-variant bg-surface-container rounded-lg min-h-[88px] gap-2 active:scale-95 transition-transform" data-type="break">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]" data-icon="coffee">coffee</span>
<span class="font-label-technical text-label-technical text-on-surface-variant tracking-widest uppercase">Break</span>
</button>
<!-- Option: General (Spans 2 columns) -->
<button onclick="selectStopType(this)" class="stop-option col-span-2 flex flex-row items-center justify-center p-stack-sm border border-outline-variant bg-surface-container rounded-lg min-h-[88px] gap-3 active:scale-95 transition-transform" data-type="general">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]" data-icon="location_on">location_on</span>
<span class="font-label-technical text-label-technical text-on-surface-variant tracking-widest uppercase">General</span>
</button>
<!-- Option: Issue -->
<button onclick="selectStopType(this)" class="stop-option col-span-1 flex flex-col items-center justify-center p-stack-sm border border-outline-variant bg-surface-container rounded-lg min-h-[88px] gap-2 active:scale-95 transition-transform" data-type="issue">
<span class="material-symbols-outlined text-error text-[32px]" data-icon="warning">warning</span>
<span class="font-label-technical text-label-technical text-error tracking-widest uppercase">Issue</span>
</button>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-sm">
<!-- Primary Action (Critical) -->
<button onclick="location.href="{% url 'pages:active-ride' %}"" class="w-full h-[64px] bg-error text-on-error font-title-md text-title-md uppercase tracking-wide rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0px_4px_0px_rgba(0,0,0,0.3)]">
<span class="material-symbols-outlined" data-icon="flag" style="font-variation-settings: 'FILL' 1;">flag</span>
                Flag Stop
            </button>
<!-- Secondary Action (Cancel) -->
<button onclick="history.back()" class="w-full min-h-touch-target-min border-2 border-outline-variant bg-transparent text-on-surface font-title-md text-title-md uppercase tracking-wide rounded-xl flex items-center justify-center active:bg-surface-container-high transition-colors">
                Cancel
            </button>
</div>
</div>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
<script>
        let selectedType = 'fuel';
        function selectStopType(btn) {
            document.querySelectorAll('.stop-option').forEach(b => {
                b.classList.remove('border-2', 'border-primary', 'bg-primary/10');
                b.classList.add('border', 'border-outline-variant', 'bg-surface-container');
                const icon = b.querySelector('.material-symbols-outlined');
                if (icon && !icon.classList.contains('text-error')) {
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-on-surface-variant');
                }
                const label = b.querySelector('.font-label-technical');
                if (label && !label.classList.contains('text-error')) {
                    label.classList.remove('text-primary');
                    label.classList.add('text-on-surface-variant');
                }
            });
            btn.classList.add('border-2', 'border-primary', 'bg-primary/10');
            btn.classList.remove('border', 'border-outline-variant', 'bg-surface-container');
            const icon = btn.querySelector('.material-symbols-outlined');
            if (icon && !icon.classList.contains('text-error')) {
                icon.classList.add('text-primary');
                icon.classList.remove('text-on-surface-variant');
            }
            const label = btn.querySelector('.font-label-technical');
            if (label && !label.classList.contains('text-error')) {
                label.classList.add('text-primary');
                label.classList.remove('text-on-surface-variant');
            }
            selectedType = btn.dataset.type;
        }
    </script>
</body></html>
